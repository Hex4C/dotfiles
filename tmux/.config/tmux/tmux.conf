# ==============================================================================
# CORE TERMINAL BEHAVIOR
# ==============================================================================

# True color support for xterm-compatible terminals
set-option -sa terminal-overrides ",xterm*:Tc"

# Zero delay for escape sequences (faster key response, e.g., vim ESC)
set -sg escape-time 0

# Enable mouse support (click panes, scroll, resize with mouse)
setw -g mouse on


# ==============================================================================
# PREFIX KEY
# ==============================================================================

# Change prefix from Ctrl-b to Ctrl-Space (easier to reach)
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix


# ==============================================================================
# WINDOW & PANE NUMBERING
# ==============================================================================

# Start windows and panes at 1 instead of 0 (keyboard layout has 1 before 0)
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1

# Automatically renumber windows when one is closed
set-option -g renumber-windows on


# ==============================================================================
# SPLIT PANES
# ==============================================================================

# Split panes open in current directory (not home)
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Vertical split with 'v' keybind (in addition to default %)
bind-key v split-window -v


# ==============================================================================
# PANE NAVIGATION
# ==============================================================================

# Vim-style hjkl for moving between panes
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R


# ==============================================================================
# KILL SHORTCUTS
# ==============================================================================

# Kill window/pane without confirmation prompt
bind-key & kill-window
bind-key x kill-pane


# ==============================================================================
# COPY MODE
# ==============================================================================

# Enter copy mode with C-u (useful for scrolling back through buffer)
bind-key C-u copy-mode -e


# ==============================================================================
# PLUGINS (managed by TPM)
# ==============================================================================

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'

# Store resurrect sessions in a custom directory (not default ~/.tmux/resurrect)
set -g @resurrect-dir '~/.config/tmux/resurrect'


# ==============================================================================
# CATPPUCCIN MOCHA COLOR PALETTE
# (Define once, reference everywhere with @thm_*)
# ==============================================================================

set -g @thm_bg "#1e1e2e"          # base background
set -g @thm_red "#f38ba8"         # accent: red
set -g @thm_maroon "#eba0ac"      # accent: maroon (lighter red)
set -g @thm_peach "#fab387"       # accent: peach
set -g @thm_yellow "#f9e2af"      # accent: yellow
set -g @thm_green "#a6e3a1"       # accent: green
set -g @thm_blue "#89b4fa"        # accent: blue
set -g @thm_sapphire "#74c7ec"    # accent: sapphire (light blue)
set -g @thm_rosewater "#f5e0dc"   # accent: rosewater (lightest pink)
set -g @thm_surface_0 "#313244"   # dark surface (inactive/pill blocks)
set -g @thm_overlay_0 "#6c7086"   # overlay (separators, subtle elements)
set -g @thm_fg "#cdd6f4"          # foreground (default text)
set -g @thm_crust "#11111b"       # darkest background (icon text)


# ==============================================================================
# STATUS BAR - LEFT SIDE (session info + current path)
# ==============================================================================

# Length of left status area (allocate space)
set -g status-left-length 100

# Initialize left status (empty by default, we build it up)
set -g status-left ""

# Segment 1: Current command/icon (maroon)
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_maroon}] 󱃷 #{pane_current_command} "

# Separator
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_overlay_0},none]│"

# Segment 2: Current path (blue, with folder icon, truncated to 32 chars)
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_blue}]  #{=/-32/...:#{s|$USER|~|:#{b:pane_current_path}}} "

# Separator (only shown if zoomed)
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_overlay_0},none]#{?window_zoomed_flag,│,}"

# Segment 3: Zoom indicator (yellow, only shown if pane is zoomed)
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_yellow}]#{?window_zoomed_flag,  zoom ,}"


# ==============================================================================
# STATUS BAR - RIGHT SIDE (session pill with icon)
# ==============================================================================

# Length of right status area
set -g status-right-length 100

# Hand-rolled session pill (rounded with powerline glyphs)
# Accent color flips to red while prefix is active
# Structure: [left cap][icon][session name][right cap]

# Left rounded cap (color changes with prefix state)
set -g status-right "#[fg=#{?client_prefix,#{@thm_red},#{@thm_green}}]"

# Icon segment ( on accent-colored background)
set -ga status-right "#[fg=#{@thm_crust},bg=#{?client_prefix,#{@thm_red},#{@thm_green}}] "

# Session name (on dark surface)
set -ga status-right "#[fg=#{@thm_fg},bg=#{@thm_surface_0}] #S "

# Right rounded cap (blends into status bar background)
set -ga status-right "#[fg=#{@thm_surface_0},bg=#{@thm_bg}]"


# ==============================================================================
# STATUS BAR - GLOBAL STYLE
# ==============================================================================

# Position of status bar (bottom instead of top)
set -g status-position bottom

# Status bar background color
set -g status-style "bg=#{@thm_bg}"

# Command prompt/input styling (sapphire instead of default yellow)
set -g message-style "fg=#{@thm_sapphire},bg=default"
set -g message-command-style "fg=#{@thm_sapphire},bg=default"

# Center window list in status bar (instead of left/right justified)
set -g status-justify "absolute-centre"


# ==============================================================================
# WINDOW STYLING (thumbnails in status bar)
# ==============================================================================

# Auto-rename windows based on running command
set -wg automatic-rename on

# Format for auto-generated window names
set -g automatic-rename-format "Window"

# Format for inactive window thumbnails: " 1: command "
set -g window-status-format " #I: #{pane_current_command} "
set -g window-status-style "bg=#{@thm_bg},fg=#{@thm_rosewater}"

# Style for last active window (rosewater instead of default)
set -g window-status-last-style "bg=#{@thm_bg},fg=#{@thm_peach}"

# Style for activity notifications (red background)
set -g window-status-activity-style "bg=#{@thm_red},fg=#{@thm_bg}"

# Style for bell notifications (red background, bold)
set -g window-status-bell-style "bg=#{@thm_red},fg=#{@thm_bg},bold"

# Separator between window thumbnails (pipe character)
set -gF window-status-separator "#[bg=#{@thm_bg},fg=#{@thm_overlay_0}]│"

# Format for active/current window: " 1: command " (peach background)
set -g window-status-current-format " #I: #{pane_current_command} "
set -g window-status-current-style "bg=#{@thm_peach},fg=#{@thm_bg},bold"


# ==============================================================================
# TPM INITIALIZATION (keep this line at the very bottom)
# ==============================================================================

run '~/.config/tmux/plugins/tpm/tpm'
